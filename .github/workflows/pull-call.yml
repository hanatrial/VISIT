name: Tarik data Call (Google Sheet)

# WITA = UTC+8. Jadwal sengaja TIDAK di menit 00: awal jam adalah waktu paling padat di GitHub
# dan jadwal di situ sering terlambat atau dibuang. Tiap slot ada 2 percobaan (data sama,
# aman diulang; concurrency mencegah dua run bersamaan).
on:
  schedule:
    - cron: '17 22 * * *'   # 06.17 WITA
    - cron: '47 22 * * *'   # 06.47 WITA (cadangan)
    - cron: '23 11 * * *'   # 19.23 WITA
    - cron: '53 11 * * *'   # 19.53 WITA (cadangan)
    - cron: '23 14 * * *'   # UJI COBA 22.23 WITA - hapus setelah uji
  workflow_dispatch: {}

concurrency:
  group: pull-call
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang pustaka xlsx
        run: npm install --no-save --no-package-lock xlsx@0.18.5
      - name: Tarik Call & Order ke Firestore
        # TZ WITA supaya format tanggal sama persis dengan upload manual dari browser (WITA)
        env:
          TZ: Asia/Makassar
        run: node scripts/pull-call.js
