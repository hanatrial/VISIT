name: Tarik data Call (Google Sheet)

# WITA = UTC+8. Jadwal sengaja TIDAK di menit 00 (awal jam paling padat di GitHub). GitHub sering
# menjalankan jadwal terlambat (teramati ~3 jam), jadi jamnya dimajukan dari jam target data siap.
# Aman diulang: data yang ditarik sama, concurrency mencegah dua run bersamaan.
on:
  schedule:
    - cron: '17 19 * * *'   # 03.17 WITA (target data siap sekitar pagi)
    - cron: '17 7 * * *'    # 15.17 WITA
    - cron: '18 10 * * *'   # 18.18 WITA
  workflow_dispatch: {}

concurrency:
  group: pull-call
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang pustaka xlsx
        run: npm install --no-save --no-package-lock xlsx@0.18.5
      - name: Tarik Call & Order ke Firestore
        run: node scripts/pull-call.js
