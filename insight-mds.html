<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Insight MDS Visit - PIC Imadur</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f6f8f6;--card:#fff;--ink:#0b2b26;--mute:#5d6f69;--line:#dbe4df;--accent:#235347}
@media (prefers-color-scheme:dark){:root{--bg:#0b1d1a;--card:#102a26;--ink:#e6f1ea;--mute:#98b0a6;--line:#1f3d37;--accent:#8eb69b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Poppins,system-ui,"Segoe UI",sans-serif}
header{padding:20px 16px 8px;max-width:1200px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mute);font-size:13px}
.tabs{display:flex;gap:8px;max-width:1200px;margin:12px auto 0;padding:0 16px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:8px;cursor:pointer;font:inherit}
.tab[aria-selected=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
@media (prefers-color-scheme:dark){.tab[aria-selected=true]{color:#0b1d1a}}
main{max-width:1200px;margin:0 auto;padding:12px 16px 40px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 2px}
.note{color:var(--mute);font-size:12px;margin:0 0 12px}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:2px;font-size:12px;width:100%}
th{font-weight:600;color:var(--mute);padding:4px 2px;text-align:center;vertical-align:bottom}
th.r{text-align:left;color:var(--ink);white-space:nowrap;padding-right:8px;min-width:150px}
td{text-align:center;padding:9px 2px;min-width:54px;border-radius:3px;font-variant-numeric:tabular-nums}
td.avg{font-weight:600;border-left:2px solid var(--line)}
tr.tot td,tr.tot th{border-top:2px solid var(--line)}
.n{color:var(--mute);font-weight:400;font-size:11px}
.scale{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;color:var(--mute)}
.scale i{display:block;width:160px;height:8px;border-radius:4px}
.mapwrap{display:grid;grid-template-columns:1fr 240px;gap:12px}
.map{background:#e9efec;height:560px;border-radius:8px;border:1px solid var(--line)}
.legend{font-size:13px;display:flex;flex-direction:column;gap:6px;align-content:start}
.legend label{display:flex;align-items:center;gap:8px;cursor:pointer}
.sw{width:12px;height:12px;border-radius:50%;flex:none}
.legend .c{color:var(--mute);margin-left:auto;font-size:12px}
.modes{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 10px;font-size:13px}.modes label{display:flex;gap:6px;align-items:center;cursor:pointer}.minfo{font-size:12px;color:var(--mute);margin:0 0 10px}table.top td{min-width:0;padding:6px 6px;text-align:right;background:transparent;border-bottom:1px solid var(--line);border-radius:0}table.top td.l,table.top th.l{text-align:left}table.top th{padding:4px 6px;white-space:nowrap}.cel{font-weight:600;color:#b45309}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:12px}.chip[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
table.hm{table-layout:fixed;min-width:820px;border-spacing:3px}.hm th.grp{background:#fff;color:#0b2b26;font-size:13px;letter-spacing:.04em;padding:8px;border-radius:4px}.hm th.gn{color:#c4161c;border-bottom:3px solid #2e7d32}.hm th.gh{color:#1d3f8f;border-bottom:3px solid #f2c200}.hm th.c2,.hm th.r2{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);padding:8px 2px}.hm th.r{font-size:10.5px;letter-spacing:.03em;white-space:normal;vertical-align:middle;text-align:left;line-height:1.25}.hm td{padding:11px 2px;font-weight:600;border-radius:4px}.hm td.t{background:transparent;font-weight:700;color:var(--ink)}.hm tr.tot th,.hm tr.tot td{border-top:2px solid var(--line)}
.hleg{display:flex;gap:6px;margin-top:10px;font-size:11px}.hleg span{padding:3px 10px;border-radius:4px;color:#0b2b26}
@media(max-width:760px){.mapwrap{grid-template-columns:1fr}.map{height:420px}}
.tarik{margin-left:8px;display:inline-block;border:1px solid var(--accent);color:var(--accent);padding:2px 10px;border-radius:999px;font-size:12px;text-decoration:none}.tarik:hover{background:var(--accent);color:#fff}
</style>
</head>
<body>
<header>
<h1>Insight MDS Visit - PIC Imadur</h1>
<div class="sub" id="sub"></div>
</header>
<div class="tabs" role="tablist" id="tabs"></div>
<main id="main"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
let D;
const PALET=['#e6194b','#3cb44b','#4363d8','#f58231','#911eb4','#008080','#9a6324','#f032e6'];
const fmt=d=>new Date(d+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
function init(){
document.getElementById('sub').innerHTML='Data Call Google Sheet, kunjungan '+fmt(D.periode[0])+' - '+fmt(D.periode[1])+' <span class="n">| dibekukan per '+new Date(D.generatedAt).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})+', diperbarui otomatis tiap tanggal 3</span> <a class="tarik" href="https://github.com/hanatrial/VISIT/actions/workflows/insight-snapshot.yml" target="_blank" rel="noopener">Tarik ulang data</a>';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function warna(p){const a=[238,246,240],b=[35,83,71];const t=Math.pow(p,.8);return 'rgb('+a.map((x,i)=>Math.round(x+(b[i]-x)*t)).join(',')+')';}
const tabs=document.getElementById('tabs'),main=document.getElementById('main');
const HB=[[0.1,'#EDB09B','#3b2a22'],[0.2,'#F6E2A0','#4a3f1d'],[0.3,'#EEF2EE','#0b2b26'],[0.4,'#A9CDB4','#0b2b26'],[9,'#4E8A6B','#fff']];
const maps={};
Object.keys(D.prov).forEach((prov,pi)=>{
  const P=D.prov[prov];
  const names=Object.keys(P.mds).sort();
  const warnaMds={};names.forEach((n,i)=>warnaMds[n]=PALET[i%PALET.length]);
  const cnt={};P.titik.forEach(t=>cnt[t[2]]=(cnt[t[2]]||0)+1);
  const leg=names.map(n=>'<label><input type="checkbox" checked data-m="'+esc(n)+'"><span class="sw" style="background:'+warnaMds[n]+'"></span>'+esc(n)+'<span class="c">'+(cnt[n]||0)+'</span></label>').join('');
  const fm=n=>n==null?'-':n.toLocaleString('id-ID');
  const sec=document.createElement('div');sec.id='p'+pi;sec.hidden=pi>0;
  sec.innerHTML=
   '<div class="chips" id="fl'+pi+'"></div>'+
   '<section><h2>1. Heatmap item utama per MDS (dari penjualan)</h2><p class="note">% visit transaksi yang menjual item itu (ada nominal penjualan di sheet Order, bonus tidak dihitung) (minimal 1 rasa dalam kelompok itu). NS Tea = semua rasa tea digabung (Lemon, Lychee, Blackcurrant, Peach, Orange, Apple), School = semua rasa HI LO School, Anggur = Anggur + Anggur Hijau. Angka dalam kurung = jumlah visit transaksi.</p><div class="scroll" id="hm'+pi+'"></div><div class="hleg"><span style="background:#EDB09B">&lt;10%</span><span style="background:#F6E2A0">10-19%</span><span style="background:#EEF2EE">20-29%</span><span style="background:#A9CDB4">30-39%</span><span style="background:#4E8A6B;color:#fff">&ge;40%</span></div></section>'+
   '<section><h2>2. Peta vektor per kecamatan</h2><div class="modes"><label><input type="radio" name="mode'+pi+'" value="celah" checked> Peluang (celah potensi vs toko ber-AV)</label><label><input type="radio" name="mode'+pi+'" value="pot"> Skor potensi</label><label><input type="radio" name="mode'+pi+'" value="mds"> Toko ber-AV per MDS</label></div><div class="minfo" id="mi'+pi+'"></div><p class="note">Peta vektor per kecamatan: warna kecamatan = MDS dengan toko ber-AV terbanyak (makin pekat = makin banyak toko). Satu titik = satu toko unik yang pernah diinput AV-nya, di lokasi check-in terbaru. Lingkaran = radius 100 m sebenarnya (terlihat saat zoom dekat). Warna = MDS; klik nama untuk tampil/sembunyi.</p><div class="mapwrap"><div class="map" id="m'+pi+'"></div><div class="legend">'+leg+'<div class="note" style="margin-top:8px">Total '+P.titik.length+' toko</div></div></div></section>'+
   '<section><h2>3. Kecamatan peluang teratas</h2><p class="note">Hanya kabupaten/kota yang sudah pernah dikunjungi MDS-mu, potensi minimal 50. Urut dari celah terbesar: skor potensi dikurangi skor toko ber-AV (keduanya peringkat persentil 0-100 di antara kecamatan yang dicakup). "MDS terdekat" = MDS dengan toko ber-AV terbanyak di kecamatan itu, atau di kecamatan ber-AV terdekat bila masih kosong.</p><div id="tt'+pi+'"></div></section>'+
   '<section><h2>Cara hitung</h2><p class="note" style="margin:0"><b>Skor potensi</b> = 50% persentil <b>penduduk</b> + 50% persentil <b>keramaian</b>. Penduduk: jumlah penduduk kabupaten/kota 2024 (file Jumlah_Penduduk_Sulawesi_2024_Full) dibagi ke kecamatan sebanding (jumlah sekolah + 1), jadi hanya estimasi karena data kecamatan belum ada. Keramaian: titik OpenStreetMap berbobot, pasar x5, terminal/pelabuhan x3, SPBU x1, toko/minimarket/kios/supermarket x1 (kelengkapan OSM tidak merata di daerah kecil). Sekolah dari daftar sekolahmu (Sekolah_Sulawesi_Selatan / Sekolah_Gorontalo) hanya dipakai sebagai pembobot penduduk dan ditampilkan sebagai info. Toko ber-AV = jumlah toko unik yang pernah diinput AV-nya (sheet Merchandise). Heatmap saja yang dibatasi pada visit transaksi.</p></section>';
  main.appendChild(sec);
  const tb=document.createElement('button');tb.className='tab';tb.setAttribute('role','tab');tb.textContent=prov;tb.setAttribute('aria-selected',pi===0);
  tb.onclick=()=>{[...tabs.children].forEach((b,j)=>{b.setAttribute('aria-selected',j===pi);document.getElementById('p'+j).hidden=j!==pi;});buildMap(pi);maps[pi].map.invalidateSize();refit(pi);};
  tabs.appendChild(tb);
  maps[pi]={P,prov,warnaMds,names,map:null,sel:null};
  initChips(pi);renderHeat(pi);fillTop(pi);
});
function hc(p){const b=HB.find(x=>p<x[0]);return 'background:'+b[1]+';color:'+b[2];}
function renderHeat(pi){
  const M=maps[pi],P=M.P,names=M.sel?[M.sel]:M.names;
  let h='<table class="hm"><colgroup><col style="width:165px"></colgroup><thead><tr><th></th>'+D.groups.map(g=>'<th class="grp '+(g.b==='HI LO'?'gh':'gn')+'" colspan="'+g.n+'">'+esc(g.b)+'</th>').join('')+'</tr><tr><th class="r2">MDS</th>'+D.fokus.map(f=>'<th class="c2">'+esc(f)+'</th>').join('')+'</tr></thead><tbody>';
  names.forEach(n=>{const m=P.mds[n];h+='<tr><th class="r">'+esc(n.toUpperCase())+' <span class="n">('+m.n+')</span></th>'+m.ada.map((a,i)=>{const p=a/m.n;return '<td style="'+hc(p)+'" title="'+esc(D.fokus[i])+': '+a+' dari '+m.n+' visit">'+Math.round(p*100)+'%</td>';}).join('')+'</tr>';});
  if(!M.sel){const N=names.reduce((a,n)=>a+P.mds[n].n,0);h+='<tr class="tot"><th class="r">'+esc(M.prov.toUpperCase())+'</th>'+D.fokus.map((_,i)=>'<td class="t">'+Math.round(100*names.reduce((a,n)=>a+P.mds[n].ada[i],0)/N)+'%</td>').join('')+'</tr>';}
  document.getElementById('hm'+pi).innerHTML=h+'</tbody></table>';
}
function fillTop(pi){
  const M=maps[pi],P=M.P;
  const top=P.kec.filter(k=>k.cov&&k.pot>=50&&(!M.sel||k.mds===M.sel)).sort((a,b)=>b.celah-a.celah).slice(0,15);
  const fm=n=>n==null?'-':n.toLocaleString('id-ID');
  document.getElementById('tt'+pi).innerHTML='<div class="scroll"><table class="top"><thead><tr><th class="l">Kecamatan</th><th class="l">Kabupaten/Kota</th><th class="l">MDS terdekat</th><th>Penduduk (est.)</th><th>Sekolah</th><th>Pasar</th><th>Terminal / pelabuhan</th><th>Toko / minimarket OSM</th><th>SPBU</th><th>Skor potensi</th><th>Toko ber-AV</th><th>Celah</th></tr></thead><tbody>'+
    (top.length?top.map(k=>'<tr><td class="l"><b>'+esc(k.n)+'</b></td><td class="l">'+esc(k.kab)+'</td><td class="l">'+esc(k.mds||'-')+'</td><td>'+fm(k.pend)+'</td><td>'+k.sek+'</td><td>'+k.pasar+'</td><td>'+k.term+'</td><td>'+k.toko+'</td><td>'+k.spbu+'</td><td>'+k.pot+'</td><td>'+k.tx+'</td><td class="cel">+'+k.celah+'</td></tr>').join(''):'<tr><td class="l" colspan="12">Belum ada kecamatan dengan potensi minimal 50 untuk MDS ini.</td></tr>')+'</tbody></table></div>';
}
function initChips(pi){
  const M=maps[pi],box=document.getElementById('fl'+pi);
  box.innerHTML='<span class="n">Filter MDS:</span><button class="chip" aria-pressed="true" data-m="">Semua MDS</button>'+M.names.map(n=>'<button class="chip" aria-pressed="false" data-m="'+esc(n)+'"><span class="sw" style="background:'+M.warnaMds[n]+';width:9px;height:9px;display:inline-block;margin-right:6px"></span>'+esc(n)+'</button>').join('');
  box.querySelectorAll('.chip').forEach(b=>b.onclick=()=>setSel(pi,b.dataset.m||null));
}
function setSel(pi,name){
  const M=maps[pi];M.sel=name;
  document.querySelectorAll('#fl'+pi+' .chip').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.m||null)===name));
  renderHeat(pi);fillTop(pi);
  document.querySelectorAll('#p'+pi+' .legend input').forEach(cb=>{const want=!name||cb.dataset.m===name;if(cb.checked!==want){cb.checked=want;if(cb.onchange)cb.onchange();}});
  refit(pi);
}
function refit(pi){
  const M=maps[pi];if(!M.map)return;M.map.invalidateSize();
  const q=M.sel?M.P.titik.filter(t=>t[2]===M.sel).map(t=>[t[0],t[1]]):[];
  if(q.length)M.map.fitBounds(L.latLngBounds(q).pad(.1));else M.fit();
}
function buildMap(pi){
  const M=maps[pi];if(M.map)return;
  const map=L.map('m'+pi,{zoomSnap:.25});
  const kecCnt=M.P.kec.map(()=>({}));
  M.P.titik.forEach(t=>{if(t[8]>=0){const o=kecCnt[t[8]];o[t[2]]=(o[t[2]]||0)+1;}});
  const tot=kecCnt.map(o=>Object.values(o).reduce((a,b)=>a+b,0)),mx=Math.max(...tot,1);
  const kb=[];M.polys=[];
  M.P.kec.forEach((k,i)=>{
    const ll=k.g.map(p=>p.map(r=>r.map(c=>[c[1],c[0]])));
    if(tot[i])kb.push(...ll.flat(2));
    M.polys.push({k,i,ll,L:L.polygon(ll,{weight:.6}).addTo(map)});
  });
  M.kecCnt=kecCnt;M.tot=tot;M.mx=mx;
  M.kb=kb;
  const grup={};M.names.forEach(n=>grup[n]=L.layerGroup().addTo(map));
  const pts=[];
  M.P.titik.forEach(t=>{
    const c=M.warnaMds[t[2]];if(!grup[t[2]])return;
    const pop='<b>'+esc(t[3])+'</b><br>'+esc(t[5])+' - '+esc(t[4])+'<br>MDS: '+esc(t[2])+'<br>Transaksi terakhir: '+fmt(t[6]);
    L.circle([t[0],t[1]],{radius:100,color:c,weight:1,opacity:.7,fillColor:c,fillOpacity:.12,interactive:false}).addTo(grup[t[2]]);
    L.circleMarker([t[0],t[1]],{radius:3,color:'#fff',weight:.8,fillColor:c,fillOpacity:1}).bindPopup(pop).addTo(grup[t[2]]);
    pts.push([t[0],t[1]]);
  });
  M.apply=function(mode){
    const info={celah:'Oranye pekat = potensi tinggi tapi toko ber-AV masih sedikit (peluang terbesar). Abu-abu = di luar kabupaten yang dikunjungi.',pot:'Hijau pekat = skor potensi tinggi (penduduk + keramaian). Abu-abu = di luar kabupaten yang dikunjungi.',mds:'Warna = MDS dengan toko ber-AV terbanyak di kecamatan; makin pekat = makin banyak toko.'};
    document.getElementById('mi'+pi).textContent=info[mode];
    M.polys.forEach(p=>{const k=p.k,i=p.i;let st;
      if(mode==='mds'){st=M.tot[i]?{color:'#44564f',weight:.8,fillColor:M.warnaMds[Object.entries(M.kecCnt[i]).sort((a,b)=>b[1]-a[1])[0][0]],fillOpacity:.25+.55*M.tot[i]/M.mx}:{color:'#9aa9a3',weight:.6,fillColor:'#000',fillOpacity:0};}
      else if(!k.cov)st={color:'#b9c4bf',weight:.5,fillColor:'#9aa9a3',fillOpacity:.18};
      else if(mode==='pot')st={color:'#44564f',weight:.6,fillColor:warna(k.pot/100),fillOpacity:.9};
      else st={color:'#6b4a1f',weight:.6,fillColor:'#e8821a',fillOpacity:k.celah>0?Math.min(.12+.8*k.celah/70,.92):0};
      p.L.setStyle(st);
      let tip='<b>'+esc(k.n)+'</b> ('+esc(k.kab)+')';
      if(k.cov)tip+='<br>Skor potensi '+k.pot+' | toko ber-AV '+k.tx+' | celah '+(k.celah>0?'+':'')+k.celah+'<br>Penduduk est. '+(k.pend==null?'-':k.pend.toLocaleString('id-ID'))+' | sekolah '+k.sek+'<br>Pasar '+k.pasar+', terminal/pelabuhan '+k.term+', toko OSM '+k.toko+', SPBU '+k.spbu;
      else tip+='<br>Di luar kabupaten yang dikunjungi';
      if(M.tot[i])tip+='<br>'+Object.entries(M.kecCnt[i]).sort((a,b)=>b[1]-a[1]).map(x=>esc(x[0])+': '+x[1]).join('<br>');
      p.L.unbindTooltip();p.L.bindTooltip(tip,{sticky:true});});
  };
  document.querySelectorAll('input[name=mode'+pi+']').forEach(r=>r.onchange=()=>M.apply(r.value));
  M.fit=function(){const q=M.kb.length?M.kb:pts;if(q.length)map.fitBounds(L.latLngBounds(q).pad(.05));};
  M.map=map;M.fit();M.apply('celah');
  document.querySelectorAll('#p'+pi+' .legend input').forEach(cb=>cb.onchange=()=>{const g=grup[cb.dataset.m];if(cb.checked)g.addTo(map);else map.removeLayer(g);});
}
buildMap(0);
}
fetch('insight-data.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{D=d;init();}).catch(e=>{document.getElementById('sub').textContent='Gagal memuat insight-data.json: '+e.message;});
</script>
</body>
</html>
